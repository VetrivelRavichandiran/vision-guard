[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionguard"
version = "1.0.0"
description = "Non-diagnostic visual ergonomics and eye-closure monitoring"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Vetrivel Ravichandiran" }
]
dependencies = [
    "opencv-python>=4.9,<5",
    "mediapipe>=0.10.14,<0.11",
    "numpy>=1.26,<3",
    "scipy>=1.10,<2",
    "PySide6>=6.7,<7",
    "pyqtgraph>=0.13.7,<0.14",
    "PyYAML>=6.0.1,<7",
    "pydantic>=2.7,<3",
    "reportlab>=4.2,<5",
    "matplotlib>=3.8,<4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2"
]
tts = [
    "pyttsx3>=2.90,<3"
]
yolo = [
    "ultralytics>=8.3,<9"
]

[project.scripts]
visionguard = "visionguard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["visionguard"]